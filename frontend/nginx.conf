server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# --- Streaming chat -----------------------------------------------------
	# SSE must not be buffered. With the default `proxy_buffering on`, nginx
	# accumulates the response and the user sees nothing until the turn ends --
	# which defeats the entire point of streaming tokens. The long read timeout
	# exists because CPU inference on the reference machine takes tens of seconds
	# per turn.
	# NOTE: deliberately no trailing slash. With `location /api/sessions/`, nginx
	# issues an automatic 301 from `/api/sessions` -- the collection endpoint the
	# UI requests on load -- to `/api/sessions/`, which FastAPI's trailing-slash
	# handling then redirects straight back to `/api/sessions`. That loop is what
	# breaks the first request in the browser. The un-slashed prefix covers the
	# collection and the per-session subtree, which is also exactly the set of
	# routes that must not be buffered.
	location /api/sessions {
		proxy_pass http://api:8000;
		proxy_http_version 1.1;
		# `$http_host`, not `$host`: it preserves the port the browser used. Both
		# nginx's own redirects and FastAPI's trailing-slash 307 build absolute
		# URLs from this header, so with a bare `$host` they point at :80, where
		# nothing listens, and the browser reports "Failed to fetch".
		proxy_set_header Host $http_host;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 900s;
		chunked_transfer_encoding on;
	}

	# --- Everything else under /api ------------------------------------------
	location /api/ {
		proxy_pass http://api:8000;
		proxy_http_version 1.1;
		# See above: keep the port so any absolute redirect stays on this origin.
		proxy_set_header Host $http_host;
		proxy_read_timeout 300s;
	}

	# Unknown paths are normal requests, not missing files, so the SPA router
	# handles them instead of nginx returning 404.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
