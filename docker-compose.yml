# =============================================================================
# The Lenny Growth Assistant -- local deployment topology
#
#   db          PostgreSQL 16 + pgvector  (relational state AND vectors)
#   ollama      local inference + embeddings (mandatory demo path, no API key)
#   ollama-init one-shot: pulls the required models, then exits
#   api         FastAPI + the Pi Coding Agent subprocess it spawns
#   web         nginx serving the built React app and proxying /api
#   ingest      one-shot, opt-in (profile: ingest)
#
# Five long-lived-or-oneshot services and no more. No Redis, no Celery, no
# separate vector store, no model gateway -- each would be a dependency that
# buys nothing at this scale.
#
# Start:  docker compose up --build -d      (or: make up)
# =============================================================================

name: lenny-growth-assistant

# Shared wiring for the Python services. Kept in one place so `api` and
# `ingest` cannot drift apart.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-180}
  INTERNAL_TOOL_TOKEN: ${INTERNAL_TOOL_TOKEN:-change-me-local-only}
  # Where the Pi extension reaches this API from inside the api container.
  INTERNAL_TOOL_BASE_URL: ${INTERNAL_TOOL_BASE_URL:-http://localhost:8000}
  PYTHONUNBUFFERED: "1"

  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-lenny}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_local_password}
  POSTGRES_DB: ${POSTGRES_DB:-lenny_growth_assistant}

  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  PROVIDER_FALLBACK_CHAIN: ${PROVIDER_FALLBACK_CHAIN:-ollama}

  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}

  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}

  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-32}

  TRANSCRIPT_SOURCE: ${TRANSCRIPT_SOURCE:-repo}
  TRANSCRIPT_REPO: ${TRANSCRIPT_REPO:-ChatPRD/lennys-podcast-transcripts}
  TRANSCRIPT_LOCAL_PATH: ${TRANSCRIPT_LOCAL_PATH:-}
  TRANSCRIPT_CACHE_DIR: /data/transcripts
  CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-500}
  CHUNK_OVERLAP_RATIO: ${CHUNK_OVERLAP_RATIO:-0.15}

  RAG_TOP_K: ${RAG_TOP_K:-6}
  RAG_VECTOR_CANDIDATES: ${RAG_VECTOR_CANDIDATES:-50}
  RAG_LEXICAL_CANDIDATES: ${RAG_LEXICAL_CANDIDATES:-50}
  RAG_RRF_K: ${RAG_RRF_K:-60}
  RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.65}

  PI_BIN: ${PI_BIN:-pi}
  PI_EXTENSION_PATH: /app/agent/growth-extension.ts
  PI_CONFIG_SOURCE: /app/agent
  PI_AGENT_HOME: /tmp/pi-agent
  SKILLS_DIR: ${SKILLS_DIR:-/app/skills}
  PI_MAX_SESSIONS: ${PI_MAX_SESSIONS:-4}
  PI_IDLE_TIMEOUT_SECONDS: ${PI_IDLE_TIMEOUT_SECONDS:-900}
  PI_MAX_TURNS: ${PI_MAX_TURNS:-8}

services:

  # --- Data ------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-lenny_growth_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny} -d ${POSTGRES_DB:-lenny_growth_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- Local inference (mandatory demo path, no API key required) -------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      # Keep the chat model resident between turns; CPU load is slow enough
      # that reloading per request would dominate latency.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Same image, but this one only pulls models and exits. Kept separate so the
  # multi-gigabyte download happens once and is visible as its own step.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Hostname comes from the compose network, not from .env
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling embedding model: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        ollama pull "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        echo "Pulling chat model: ${OLLAMA_MODEL:-llama3.2:3b}"
        ollama pull "${OLLAMA_MODEL:-llama3.2:3b}"
        echo "Models ready:"
        ollama list
    restart: "no"

  # --- Application -----------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      # The Pi extension, its model catalog, and the skills are config, not image
      # content, so they can be edited without a rebuild.
      - ./agent:/app/agent:ro
      - ./skills:/app/skills:ro
      - transcript_cache:/data/transcripts
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  # --- One-shot ingestion (opt-in) -------------------------------------------
  #   docker compose run --rm --profile ingest ingest
  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["ingest"]
    environment:
      <<: *backend-env
    volumes:
      - ./agent:/app/agent:ro
      - transcript_cache:/data/transcripts
    command: ["python", "-m", "scripts.ingest"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  ollama_models:
  transcript_cache:
